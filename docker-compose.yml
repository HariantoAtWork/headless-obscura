services:
  obscura:
    container_name: obscura-headless
    build:
      context: .
      dockerfile: Dockerfile
    image: obscura-headless:alpine-bun
    platform: linux/amd64
    ports:
      - "${OBSCURA_HOST_PORT:-9222}:9222"
    environment:
      OBSCURA_PORT: "${OBSCURA_PORT:-9222}"
      OBSCURA_INTERNAL_PORT: "${OBSCURA_INTERNAL_PORT:-9223}"
    restart: unless-stopped
